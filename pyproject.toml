[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-async"
version = "3.11.4"
description = "Modern asynchronous library for Telegram Bot API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Denys", email = "your@email.com"}
]
keywords = ["telegram", "bot", "api", "async", "aiohttp", "bot-api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
]

[project.scripts]
telegram-async = "telegram_async.cli:main"
telegram-cli = "telegram_async.cli:main"
tg = "telegram_async.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/telegram-async"
Documentation = "https://github.com/yourusername/telegram-async#readme"
Repository = "https://github.com/yourusername/telegram-async"
"Bug Tracker" = "https://github.com/yourusername/telegram-async/issues"
Changelog = "https://github.com/yourusername/telegram-async/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "telegram_async",
    "telegram_async.client",
    "telegram_async.dispatcher",
    "telegram_async.exceptions",
    "telegram_async.filters",
    "telegram_async.fsm",
    "telegram_async.handlers",
    "telegram_async.keyboards",
    "telegram_async.middleware",
    "telegram_async.telegram_types",
    "telegram_async.utils",
    "telegram_async.contrib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.package-dir]
telegram_async = "."
